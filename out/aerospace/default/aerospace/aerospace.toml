# Reference: https://nikitabobko.github.io/AeroSpace/guide
# Hyper (cmd-alt-ctrl-shift) only: plain alt types umlauts on the
# "U.S. with German Umlauts" layout.

config-version = 2

# Firefox starts on the MacBook screen but stays movable (a force-assignment would lock it).
after-startup-command = ['move-workspace-to-monitor --workspace B built-in']
start-at-login = true
auto-reload-config = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

# One workspace per app, lettered like the old Alfred AppSwitcher hotkeys.
# Signal and Telegram share S; Hyper+Z goes there too.
persistent-workspaces = ["A", "B", "C", "F", "G", "R", "S", "T"]

on-mode-changed = []
focus-follows-mouse.enabled = false

# Keycode based, same as Alfred hotkeys, so ZMK letters line up.
key-mapping.preset = 'qwerty'

gaps.inner.horizontal = 8
gaps.inner.vertical =   8
gaps.outer.left =       8
gaps.outer.bottom =     8
gaps.outer.top =        8
gaps.outer.right =      8

[mode.main.binding]
    # Jump to the app's workspace; launch the app if it isn't running.
    cmd-alt-ctrl-shift-a = 'exec-and-forget ~/.config/aerospace/refocus A; pgrep -xq thunderbird || open -a Thunderbird'
    cmd-alt-ctrl-shift-b = 'exec-and-forget ~/.config/aerospace/refocus B; pgrep -xq firefox || open -a Firefox'
    cmd-alt-ctrl-shift-c = 'exec-and-forget ~/.config/aerospace/refocus C; pgrep -xq Calendar || open -a Calendar'
    cmd-alt-ctrl-shift-f = 'exec-and-forget ~/.config/aerospace/refocus F; pgrep -xq Finder || open -a Finder'
    cmd-alt-ctrl-shift-g = 'exec-and-forget ~/.config/aerospace/refocus G; pgrep -xq "Google Chrome" || open -a "Google Chrome"'
    # R holds floating apps; open -a brings the right one to the front.
    cmd-alt-ctrl-shift-r = 'exec-and-forget open -a Reminders'
    cmd-alt-ctrl-shift-p = 'exec-and-forget open -a Bitwarden'
    # S is shared; open -a focuses the named app, not the last-used one.
    cmd-alt-ctrl-shift-s = 'exec-and-forget open -a Signal'
    cmd-alt-ctrl-shift-t = 'exec-and-forget ~/.config/aerospace/refocus T; pgrep -xq kitty || open -a kitty'
    cmd-alt-ctrl-shift-z = 'exec-and-forget open -a Telegram'

    # Like vim-tmux-navigator, but for windows (wrapping); nav hands kitty's keys to tmux.
    ctrl-left =  'exec-and-forget ~/.config/aerospace/nav left'
    ctrl-down =  'exec-and-forget ~/.config/aerospace/nav down'
    ctrl-up =    'exec-and-forget ~/.config/aerospace/nav up'
    ctrl-right = 'exec-and-forget ~/.config/aerospace/nav right'

    cmd-alt-ctrl-shift-tab = 'workspace-back-and-forth'

    # Hyper uses every modifier, so moving windows lives in a mode.
    cmd-alt-ctrl-shift-space = 'mode wm'

# Every action returns to main, except resize.
[mode.wm.binding]
    esc = ['reload-config', 'mode main']

    left =  ['move left', 'mode main']
    down =  ['move down', 'mode main']
    up =    ['move up', 'mode main']
    right = ['move right', 'mode main']

    # Nest with a neighbour, e.g. split the right half top-bottom.
    shift-left =  ['join-with left', 'mode main']
    shift-down =  ['join-with down', 'mode main']
    shift-up =    ['join-with up', 'mode main']
    shift-right = ['join-with right', 'mode main']

    # Other screen: tab moves the whole workspace, shift-tab just the window.
    tab =       ['move-workspace-to-monitor --wrap-around next', 'mode main']
    shift-tab = ['move-node-to-monitor --wrap-around --focus-follows-window next', 'mode main']
    m =         ['move-node-to-monitor --focus-follows-window LG', 'fullscreen', 'mode main']

    minus = 'resize smart -50'
    equal = 'resize smart +50'

    space =     ['layout floating tiling', 'mode main']
    enter =     ['fullscreen', 'mode main']
    slash =     ['layout tiles horizontal vertical', 'mode main']
    comma =     ['layout accordion horizontal vertical', 'mode main']
    backspace = ['flatten-workspace-tree', 'mode main']

    a = ['move-node-to-workspace --focus-follows-window A', 'mode main']
    b = ['move-node-to-workspace --focus-follows-window B', 'mode main']
    c = ['move-node-to-workspace --focus-follows-window C', 'mode main']
    f = ['move-node-to-workspace --focus-follows-window F', 'mode main']
    g = ['move-node-to-workspace --focus-follows-window G', 'mode main']
    p = ['move-node-to-workspace --focus-follows-window R', 'mode main']
    r = ['move-node-to-workspace --focus-follows-window R', 'mode main']
    s = ['move-node-to-workspace --focus-follows-window S', 'mode main']
    t = ['move-node-to-workspace --focus-follows-window T', 'mode main']
    z = ['move-node-to-workspace --focus-follows-window S', 'mode main']

# Gecko reports dialogs as standard windows, so float the send/save progress by title.
[[on-window-detected]]
    if.app-id = 'org.mozilla.thunderbird'
    if.window-title-regex-substring = '^Nachricht (wird gesendet|wird gespeichert|senden|speichern)'
    run = ['layout floating', 'move-node-to-workspace A']

[[on-window-detected]]
    if.app-id = 'org.mozilla.thunderbird'
    run = 'move-node-to-workspace A'

[[on-window-detected]]
    if.app-id = 'org.mozilla.firefox'
    run = 'move-node-to-workspace B'

[[on-window-detected]]
    if.app-id = 'com.apple.iCal'
    run = 'move-node-to-workspace C'

[[on-window-detected]]
    if.app-id = 'com.apple.finder'
    run = 'move-node-to-workspace F'

[[on-window-detected]]
    if.app-id = 'com.google.Chrome'
    run = 'move-node-to-workspace G'

[[on-window-detected]]
    if.app-id = 'com.bitwarden.desktop'
    run = ['layout floating', 'move-node-to-workspace R']

[[on-window-detected]]
    if.app-id = 'com.apple.reminders'
    run = ['layout floating', 'move-node-to-workspace R']

[[on-window-detected]]
    if.app-id = 'org.whispersystems.signal-desktop'
    run = 'move-node-to-workspace S'

# Exact match: the quick-access terminal (net.kovidgoyal.kitty-quick-access) stays put.
[[on-window-detected]]
    if.app-id = 'net.kovidgoyal.kitty'
    run = 'move-node-to-workspace T'

[[on-window-detected]]
    if.app-id = 'com.tdesktop.Telegram'
    run = 'move-node-to-workspace S'

# Apps without a rule above float over the current workspace; first match wins.
[[on-window-detected]]
    if = 'true'
    run = 'layout floating'
